name: Continuous Deployment

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and build Frontend
        working-directory: frontend
        env:
          VITE_API_URL: /api
          VITE_API_KEY: board-game-system-secure-api-key-2026
        run: |
          npm ci
          npm run build

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          cat << 'SSHEOF' > ~/.ssh/config
          Host *
            ServerAliveInterval 30
            ServerAliveCountMax 10
            StrictHostKeyChecking no
          SSHEOF

          echo "==== Updating source code on EC2 ===="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'REMOTE_INIT'
            set -e
            cd /home/ubuntu/Board-Game-System
            git fetch origin main
            git reset --hard origin/main
          REMOTE_INIT

          echo "==== Transferring pre-built frontend to EC2 ===="
          tar -czf - -C frontend/dist . | ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" "mkdir -p /home/ubuntu/Board-Game-System/frontend/dist && tar -xzf - -C /home/ubuntu/Board-Game-System/frontend/dist"

          echo "==== Rebuilding and starting containers ===="
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" << 'REMOTE_DEPLOY'
            set -e
            cd /home/ubuntu/Board-Game-System
            docker compose up -d --build
            docker image prune -f
            docker compose ps
            echo "==== Deployment Completed Successfully ===="
          REMOTE_DEPLOY
